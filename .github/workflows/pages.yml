name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Refuse a committed key
        run: |
          if grep -E 'sb_publishable_[A-Za-z0-9_-]{8,}|eyJ[A-Za-z0-9_-]{20,}\.' config.js index.html; then
            echo "A publishable key is committed. Remove it and use the SUPABASE_PUBLISHABLE_KEY secret."
            exit 1
          fi

      - name: Write config.js from the publishable-key secret
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node -e 'const fs=require("fs"); const key=String(process.env.SUPABASE_PUBLISHABLE_KEY||"").trim(); const live=key.length>20; fs.writeFileSync("config.js","window.HOTELHQ_CONFIG="+JSON.stringify({supabaseUrl:"https://clxvmtbmveusrbxacnxe.supabase.co",supabaseKey:key,mode:live?"live":"demo"})+";\n");'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
