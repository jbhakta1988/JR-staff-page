function ensureSb(){

  if(sb)return Promise.resolve(sb);
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src=SB_JS;s.async=true;

      if(!lib||!lib.createClient){reject(new Error("supabase-js did not load"));return}

function dbBag(){try{return JSON.parse(sget(DB_CACHE)||"{}")}catch(e){return {}}}
function dbBagSave(b){sset(DB_CACHE,JSON.stringify(b))}
function dbCachePut(table,row){
  if(!row)return;
  const bag=dbBag();const rows=bag[table]||[];
  const i=rows.findIndex(r=>r.id===row.id);
  if(i>=0)rows[i]=row;else rows.unshift(row);
  bag[table]=rows;dbBagSave(bag);

      const rows=res.data.map(mapDirectoryRow).filter(Boolean);
      if(rows.length){directorySource="supabase";return rows}
    }catch(e){}

async function dbSelect(table,opts){
  opts=opts||{};
  const bag=dbBag();
  const cached=(bag[table]||[]).filter(r=>!opts.eq||Object.entries(opts.eq).every(([k,v])=>r[k]===v));
  if(!useRemote())return cached;
  try{
    let q=sb.from(table).select("*").limit(opts.limit||1000);
    if(opts.eq)for(const [k,v] of Object.entries(opts.eq))if(v!=null)q=q.eq(k,v);
    const {data,error}=await q;
    if(error)throw error;
    if(opts.eq){
      const rest=(bag[table]||[]).filter(r=>!Object.entries(opts.eq).every(([k,v])=>r[k]===v));
      bag[table]=rest.concat(data||[]);
    }else bag[table]=data||[];
    dbBagSave(bag);
    return data||[];
  }catch(e){
    Ssync="syncRead:"+table;
    return cached;
  }
}
async function dbInsert(table,row){
  const body={...row};delete body.id;
  if(!useRemote()){const local={...body,_local:true};dbCachePut(table,local);return {data:local,source:"local"}}
  try{
    const {data,error}=await sb.from(table).insert(body).select().single();
    if(error)throw error;
    dbCachePut(table,data);
    return {data,source:"supabase"};
  }catch(e){
    const local={...body,_local:true};dbCachePut(table,local);
    Ssync="syncWrite:"+table;
    return {data:local,source:"local",error:e};
  }
}
async function dbUpdate(table,id,patch){
  if(!id||String(id).startsWith("local"))return {data:null,source:"local"};
  if(!useRemote())return {data:null,source:"local"};
  try{
    const {data,error}=await sb.from(table).update(patch).eq("id",id).select().single();
    if(error)throw error;
    dbCachePut(table,data);
    return {data,source:"supabase"};
  }catch(e){
    Ssync="syncUpdate:"+table;
    return {data:null,source:"local",error:e};
  }
}
async function dbRemove(table,id){
  if(!id||!useRemote())return {source:"local"};
  try{
    const {error}=await sb.from(table).delete().eq("id",id);
    if(error)throw error;
    const bag=dbBag();bag[table]=(bag[table]||[]).filter(r=>r.id!==id);dbBagSave(bag);
    return {source:"supabase"};
  }catch(e){
    Ssync="syncDelete:"+table;
    return {source:"local",error:e};
  }
}

function dueIso(v){
  if(!v||v==="Today")return ld();
  const m=String(v).match(/^(\d{1,2})\/(\d{1,2})$/);
  if(!m)return null;
  return new Date().getFullYear()+"-"+String(m[1]).padStart(2,"0")+"-"+String(m[2]).padStart(2,"0");
}
function runAtIso(day,label){
  const m=String(label||"").trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?$/i);
  if(!day||!m)return null;
  let h=+m[1];const min=+(m[2]||0);const ap=(m[3]||"").toUpperCase();
  if(ap==="PM"&&h<12)h+=12;if(ap==="AM"&&h===12)h=0;
  if(h>23||min>59)return null;
  const d=new Date(day+"T"+String(h).padStart(2,"0")+":"+String(min).padStart(2,"0")+":00");
  return Number.isNaN(d.getTime())?null:d.toISOString();
}
function hhmm(ts){
  if(!ts)return "";
  const d=new Date(ts);if(Number.isNaN(d.getTime()))return String(ts).slice(11,16);

}

function shiftPublished(s){return !!((S.pub||{})[s.scope+"|"+mondayOfDate(s.date)])}
function queuePush(){pushChain=pushChain.then(()=>pushDiff()).catch(e=>{Ssync=String(e&&e.message||e)})}

function snap(){
  const hotels={};
  Object.keys(S.h||{}).forEach(h=>{
    const d=S.h[h]||{};
    hotels[h]={
      rooms:(d.rooms||[]).map(r=>({key:String(r.n),sig:[r.s,r.hk||"",hkPri(r)].join("|"),sb_id:r.sb_id||null})),
      wo:(d.wo||[]).map(w=>({key:String(w.id),sig:[w.room,w.t,w.p,w.s,(w.photo_paths||[]).join(",")].join("|"),sb_id:w.sb_id||null})),
      insp:(d.insp||[]).map(x=>({key:lid(x),sig:[x.room,x.score,x.notes,(x.failed||[]).join(",")].join("|"),sb_id:x.sb_id||null})),
      pm:(d.pm||[]).map(p=>({key:lid(p),sig:[p.a,p.f,p.due,p.done].join("|"),sb_id:p.sb_id||null})),
      notes:(d.notes||[]).map(n=>({key:lid(n),sig:[n.sh,n.t].join("|"),sb_id:n.sb_id||null})),
      inv:(d.inv||[]).map(x=>({key:x.it,sig:[x.par,x.oh,x.u].join("|"),sb_id:x.sb_id||null})),
      orders:(d.orders||[]).map(o=>({key:lid(o),sig:[o.st,o.items].join("|"),sb_id:o.sb_id||null})),
      walk:{sig:JSON.stringify(d.walk||[]),sb_id:(d.sbWalkId||null)},
      lists:(d.sbLists||[]).map(l=>({key:String(l.id),sig:JSON.stringify(l.results||{}),sb_id:l.run_id||null})),
      equip:(d.equip||[]).map(e=>({key:String(e.id),sig:eqSig(e),sb_id:e.sb_id||null})),
      equipLog:(d.equipLog||[]).map(g=>({key:String(g.id),sig:[g.equipId,g.kind,g.date,g.who,ftPlain(g,g.notes||"")].join("|"),sb_id:g.sb_id||null}))
    };
  });
  const shifts=(S.shifts||[]).map(s=>({key:s.id,sig:[s.scope,s.pos,s.who,s.date,s.start,s.end,shiftPublished(s)?1:0].join("|"),sb_id:s.sb_id||null}));
  const shuttle=[];
  Object.entries(S.shuttle||{}).forEach(([day,block])=>{
    (block.runs||[]).forEach(run=>{
      (run.pax||[]).forEach(p=>{
        shuttle.push({key:lid(p),sig:[p.g,p.r,p.n,p.h,run.t,run.to].join("|"),sb_id:p.sb_id||null,day});
      });
    });
  });
  return {hotels,shifts,shuttle};
}
async function pushDiff(){
  if(!useRemote()||!sbBase)return;
  const now=snap();let failed=false;
  for(const h of Object.keys(now.hotels)){
    if(!S.h[h])continue;
    failed=await syncRooms(h,sbBase.hotels[h],now.hotels[h])||failed;
    failed=await syncSimple(h,"wo",sbBase.hotels[h],now.hotels[h],woBody, "work_orders")||failed;
    failed=await syncSimple(h,"insp",sbBase.hotels[h],now.hotels[h],inspBody,"inspections")||failed;
    failed=await syncSimple(h,"pm",sbBase.hotels[h],now.hotels[h],pmBody,"pm_tasks")||failed;
    failed=await syncSimple(h,"notes",sbBase.hotels[h],now.hotels[h],noteBody,"shift_notes")||failed;
    failed=await syncSimple(h,"inv",sbBase.hotels[h],now.hotels[h],invBody,"inventory_items")||failed;
    failed=await syncSimple(h,"orders",sbBase.hotels[h],now.hotels[h],orderBody,"purchase_orders")||failed;
    failed=await syncWalk(h,sbBase.hotels[h],now.hotels[h])||failed;
    failed=await syncLists(h,sbBase.hotels[h],now.hotels[h])||failed;
    failed=await syncEquip(h,sbBase.hotels[h],now.hotels[h])||failed;
  }
  failed=await syncShifts(sbBase.shifts,now.shifts)||failed;
  failed=await syncShuttle(sbBase.shuttle,now.shuttle)||failed;
  if(!failed){Ssync="";sbBase=snap()}
  sset(KEY,JSON.stringify(S));
}
function lid(obj){if(!obj.lid)obj.lid="l"+Math.random().toString(36).slice(2,10);return obj.lid}
function liveOf(hotel,kind,item){
  const d=S.h[hotel];
  if(kind==="wo")return (d.wo||[]).find(w=>String(w.id)===item.key);
  if(kind==="inv")return (d.inv||[]).find(x=>x.it===item.key);
  const list={insp:d.insp,pm:d.pm,notes:d.notes,orders:d.orders}[kind]||[];

}

function pmBody(h,p){const due=dueIso(p.due);const row={hotel_id:h,department:"maintenance",asset:p.a||"PM",frequency:p.f||null,done:!!p.done};if(due)row.due_date=due;return row}

async function syncRooms(hotel,before,after){
  const prev=new Map(((before&&before.rooms)||[]).map(x=>[x.key,x]));
  let failed=false;
  for(const item of after.rooms){
    const was=prev.get(item.key);
    if(was&&was.sig===item.sig)continue;
    const row=(S.h[hotel].rooms||[]).find(r=>String(r.n)===item.key);if(!row)continue;
    const body={hotel_id:hotel,department:"housekeeping",room_number:String(row.n),floor:Math.floor(Number(row.n)/100)||null,hk_status:row.s||null,fo_status:row.s||null};
    if(row.sb_id){const res=await dbUpdate("rooms",row.sb_id,{hk_status:body.hk_status,fo_status:body.fo_status});if(res.source!=="supabase")failed=true}
    else{const res=await dbInsert("rooms",body);if(res.source==="supabase"&&res.data&&res.data.id)row.sb_id=res.data.id;else failed=true}
    const oldParts=was?String(was.sig).split("|"):[];
    const oldPri=oldParts.length>=3&&HK_PRI.includes(oldParts[oldParts.length-1])?oldParts.pop():"normal";
    const oldHk=oldParts.slice(1).join("|");
    if(row.hk&&(String(row.hk||"")!==String(oldHk||"")||hkPri(row)!==oldPri)){
      const asg={hotel_id:hotel,department:"housekeeping",work_date:ld(),room_number:String(row.n),status:"assigned",clean_type:row.s||null,priority:hkPri(row)};
      const who=userByName(String(row.hk).replace(" (EX)",""));
      if(who&&isUuid(who.user_id))asg.assignee=who.user_id;
      if(row.asg_id){const res=await dbUpdate("hk_assignments",row.asg_id,asg);if(res.source!=="supabase")failed=true}
      else{const res=await dbInsert("hk_assignments",asg);if(res.source==="supabase"&&res.data&&res.data.id)row.asg_id=res.data.id;else failed=true}
    }
  }
  return failed;
}
async function syncSimple(hotel,kind,before,after,toRow,table){
  const prev=new Map(((before&&before[kind])||[]).map(x=>[x.key,x]));
  let failed=false;
  for(const item of after[kind]){
    const was=prev.get(item.key);
    if(was&&was.sig===item.sig)continue;
    const live=liveOf(hotel,kind,item);if(!live)continue;
    const body=toRow(hotel,live);
    const id=live.sb_id;
    if(id){const res=await dbUpdate(table,id,body);if(res.source!=="supabase")failed=true}
    else{
      const res=await dbInsert(table,body);
      if(res.source==="supabase"&&res.data&&res.data.id){
        live.sb_id=res.data.id;
        if(kind==="wo"&&live.photoFile){const ok=await attachWoPhoto(hotel,live,res.data.id);if(!ok)failed=true}
      }else failed=true;
    }
  }
  return failed;
}
async function attachWoPhoto(hotel,w,remoteId){
  try{
    const file=w.photoFile;if(!file)return true;
    const safe=String(file.name||"photo.jpg").replace(/[^A-Za-z0-9._-]/g,"_");
    const path=hotel+"/"+remoteId+"/"+Date.now()+"-"+safe;
    const up=await sb.storage.from("work-order-photos").upload(path,file,{contentType:file.type||"image/jpeg",upsert:false});
    if(up.error)throw up.error;
    const paths=[...(w.photo_paths||[]),path];
    const res=await dbUpdate("work_orders",remoteId,{photo_paths:paths});
    if(res.source!=="supabase")return false;
    w.photo_paths=paths;delete w.photoFile;
    const signed=await sb.storage.from("work-order-photos").createSignedUrl(path,3600);
    if(signed.data&&signed.data.signedUrl)w.photo=signed.data.signedUrl;
    return true;
  }catch(e){Ssync="Work order saved. The photo stayed on this device.";return false}
}
async function syncWalk(hotel,before,after){

  return true;
}

async function syncShifts(before,after){
  const prev=new Map((before||[]).map(x=>[x.key,x]));

    const was=prev.get(item.key);
    const live=(S.shifts||[]).find(s=>s.id===item.key);
    if(was&&!live&&was.sb_id){const res=await dbRemove("schedule_shifts",was.sb_id);if(res.source!=="supabase")failed=true;continue}

    const body={hotel_id:hotel,department:posDept(live.pos),position:live.pos,shift_date:live.date,start_time:live.start.length===5?live.start+":00":live.start,end_time:live.end.length===5?live.end+":00":live.end,hours:shHrs(live.start,live.end),published:shiftPublished(live)};
    if(who&&isUuid(who.user_id))body.employee=who.user_id;
    if(live.sb_id){const res=await dbUpdate("schedule_shifts",live.sb_id,body);if(res.source!=="supabase")failed=true}
    else{const res=await dbInsert("schedule_shifts",body);if(res.source==="supabase"&&res.data&&res.data.id)live.sb_id=res.data.id;else failed=true}
  }
  return failed;
}
async function syncShuttle(before,after){

  for(const item of after){
    const was=prev.get(item.key);
    if(was&&was.sig===item.sig)continue;
    const block=(S.shuttle||{})[item.day];let run=null,pax=null;

  }

function mergeSbSignups(k){

  if(!block||block.sbMerged||!(S.sbSignups||[]).length)return;
  block.sbMerged=1;
  (S.sbSignups||[]).forEach(s=>{
    if(String(s.run_at||"").slice(0,10)!==k)return;
    let run=(block.runs||[]).find(r=>(r.to||"")===(s.destination||"")&&hhmm(s.run_at)===r.t);
    if(!run){run={t:hhmm(s.run_at)||"Saved",to:s.destination||"Shuttle",type:"Saved",st:s.status||"Booked",cap:14,pax:[]};block.runs.push(run)}

  });
}

// HOTEL EFFECTIVENESS DATA LAYER
// Plan hours and actual punches will later come from Hotel Effectiveness.
// laborPlan.hours[hotel|SHUTTLE][position] = Mon..Sun plan hours.
// laborPlan.associate[hotel|SHUTTLE][name] = Mon..Sun plan hours.
// laborPlan.rooms[hotel] = Mon..Sun room count used for housekeeping MPR.
// timePunches[hotel|SHUTTLE][name] = Mon..Sun [in,out] or null.
// Example data is below. If data/labor.json is present, it replaces laborPlan and timePunches.
const HE_ROOMS={MSPWE:[32,32,28,32,34,30,0],MSPAM:[30,30,26,32,34,28,0],MSPMS:[28,30,26,30,32,26,0]};
const HE_PAT={
"Front Desk":{days:[0,1,2,3,4,5],a:"07:00",b:"15:00",over:{2:["06:00","16:00"]}},
"Housekeeping":{days:[0,1,2,3,4],a:"07:00",b:"15:00"},
"Housekeeper":{days:[0,1,2,3,4,5],a:"08:00",b:"16:00",over:{2:["07:00","17:30"]}},
"Maintenance":{days:[0,1,2,3,4],a:"08:00",b:"16:00"},
"House Person":{days:[0,1,2,3,4,5],a:"08:00",b:"16:00"},
"Laundry Attendant":{days:[0,1,2,3,4,5],a:"07:00",b:"15:00"},
"Breakfast Attendant":{days:[0,1,2,3,4,5],a:"05:30",b:"13:30",over:{4:["05:00","14:00"]}},
"Shuttle Driver":{days:[0,1,2,3,4,5],a:"07:00",b:"15:00",over:{2:["06:00","15:00"]},late:["15:00","23:00"]}
};
function expandHE(users){
  const hours={SHUTTLE:{"Shuttle Driver":[0,0,0,0,0,0,0]}},associate={SHUTTLE:{}},punches={SHUTTLE:{}};
  Object.keys(HE_ROOMS).forEach(h=>{hours[h]={};associate[h]={};punches[h]={}});
  const drivers=users.filter(u=>u.role==="Shuttle Driver").slice().sort((a,b)=>a.hotel.localeCompare(b.hotel));
  users.forEach(u=>{
    if(!u.hotel||!HE_PAT[u.role])return;
    const pos=u.role==="Housekeeping"?"HK Lead":u.role, pat=HE_PAT[u.role], bucket=u.role==="Shuttle Driver"?"SHUTTLE":u.hotel;
    const late=u.role==="Shuttle Driver"&&drivers[1]&&drivers[1].id===u.id;
    const plan=[0,0,0,0,0,0,0]; pat.days.forEach(i=>plan[i]=8);
    associate[bucket][u.name]=plan;
    punches[bucket][u.name]=[0,1,2,3,4,5,6].map(i=>{
      if(!pat.days.includes(i))return null;
      if(late)return pat.late.slice();
      if(pat.over&&pat.over[i])return pat.over[i].slice();
      return [pat.a,pat.b];
    });
    if(!hours[bucket][pos])hours[bucket][pos]=[0,0,0,0,0,0,0];
    plan.forEach((n,i)=>hours[bucket][pos][i]+=n);
  });
  return {laborPlan:{hours:hours,associate:associate,rooms:HE_ROOMS},timePunches:punches};
}

function addDaysIso(iso,n){const d=new Date(String(iso).slice(0,10)+"T12:00:00");if(isNaN(+d))return "";d.setDate(d.getDate()+Number(n)||0);return ymd(d)}

function eqDateLabel(iso){if(!iso)return "";const d=new Date(String(iso).slice(0,10)+"T12:00:00");if(isNaN(+d))return String(iso);return d.toLocaleDateString(localeTag(),{day:"numeric",month:"short",year:"numeric"})}

function filtersDue(){

async function syncEquip(hotel,before,after){
  const prevE=new Map(((before&&before.equip)||[]).map(x=>[x.key,x]));
  const prevL=new Map(((before&&before.equipLog)||[]).map(x=>[x.key,x]));
  let failed=false;
  for(const item of (after&&after.equip)||[]){
    const was=prevE.get(item.key);
    if(was&&was.sig===item.sig) continue;
    const live=(S.h[hotel].equip||[]).find(e=>String(e.id)===item.key); if(!live) continue;
    const body=eqBody(hotel,live);
    if(live.sb_id){const res=await dbUpdate("equipment",live.sb_id,body);if(res.source!=="supabase")failed=true}
    else {const res=await dbInsert("equipment",body);if(res.source==="supabase"&&res.data&&res.data.id)live.sb_id=res.data.id;else failed=true}
  }
  for(const item of (after&&after.equipLog)||[]){
    const was=prevL.get(item.key);
    if(was&&was.sig===item.sig) continue;
    const live=(S.h[hotel].equipLog||[]).find(g=>String(g.id)===item.key); if(!live||live.sb_id) continue;
    const body=eqLogBody(hotel,live);
    const res=await dbInsert("equipment_service_log",body);
    if(res.source==="supabase"&&res.data&&res.data.id)live.sb_id=res.data.id;else failed=true;
  }
  return failed;
}
