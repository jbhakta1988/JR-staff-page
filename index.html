async function dbSelect(table,opts){
  opts=opts||{};
  const bag=dbBag();
  const cached=(bag[table]||[]).filter(r=>!opts.eq||Object.entries(opts.eq).every(([k,v])=>r[k]===v));
  if(!useRemote())return cached;
  try{
    let q=sb.from(table).select("*").limit(opts.limit||1000);
    if(opts.eq)for(const [k,v] of Object.entries(opts.eq))if(v!=null)q=q.eq(k,v);
    const {data,error}=await q;
    if(error)throw error;
    if(opts.eq){
      const rest=(bag[table]||[]).filter(r=>!Object.entries(opts.eq).every(([k,v])=>r[k]===v));
      bag[table]=rest.concat(data||[]);
    }else bag[table]=data||[];
    dbBagSave(bag);
    return data||[];
  }catch(e){
    Ssync="syncRead:"+table;
    return cached;
  }
}
async function dbInsert(table,row){
  const body={...row};delete body.id;
  if(!useRemote()){const local={...body,_local:true};dbCachePut(table,local);return {data:local,source:"local"}}
  try{
    const {data,error}=await sb.from(table).insert(body).select().single();
    if(error)throw error;
    dbCachePut(table,data);
    return {data,source:"supabase"};
  }catch(e){
    const local={...body,_local:true};dbCachePut(table,local);
    Ssync="syncWrite:"+table;
    return {data:local,source:"local",error:e};
  }
}
async function dbUpdate(table,id,patch){
  if(!id||String(id).startsWith("local"))return {data:null,source:"local"};
  if(!useRemote())return {data:null,source:"local"};
  try{
    const {data,error}=await sb.from(table).update(patch).eq("id",id).select().single();
    if(error)throw error;
    dbCachePut(table,data);
    return {data,source:"supabase"};
  }catch(e){
    Ssync="syncUpdate:"+table;
    return {data:null,source:"local",error:e};
  }
}

function ftPick(row){
  const tr=row&&row.translations&&typeof row.translations==="object"?row.translations:{};

  const text_es=(row&&(row.text_es||tr.es||tr.text_es))||"";
  const lang=row&&(row.lang==="en"||row.lang==="es")?row.lang:(row&&(row.source_lang==="en"||row.source_lang==="es")?row.source_lang:"");
  const o={};
  if(text_en)o.text_en=text_en;
  if(text_es)o.text_es=text_es;
  if(lang)o.lang=lang;
  return o;
}
function ftNorm(rec, plain){
  const src=rec&&typeof rec==="object"?rec:{};
  let text_en=src.text_en||"", text_es=src.text_es||"", lang=src.lang==="en"||src.lang==="es"?src.lang:"";
  const raw=plain!=null?String(plain):(typeof rec==="string"?rec:"");
  const hit=FT_LOOKUP[raw]||FT_LOOKUP[text_en]||FT_LOOKUP[text_es];
  if(hit){text_en=text_en||hit.text_en;text_es=text_es||hit.text_es;lang=lang||hit.lang}
  if(!lang) lang=text_es&&!text_en?"es":(text_en?"en":"");
  return {lang,text_en,text_es,raw};
}
function ftCapture(text){

function ftView(rec, plain, id){
  const n=ftNorm(rec, plain);
  const want=LANG==="es"?"es":"en";
  const by={en:n.text_en,es:n.text_es};
  const hasBoth=!!(n.text_en&&n.text_es);
  const origLang=n.lang==="es"?"es":"en";
  const defLang=by[want]?want:(by[origLang]?origLang:(n.text_en?"en":"es"));
  const shownLang=FTTOG[id]&&hasBoth?(defLang==="en"?"es":"en"):defLang;
  return {text:by[shownLang]||n.raw||"", shown:shownLang==="es"?"ES":"EN", canToggle:hasBoth, showingOrig:shownLang===origLang};
}
function noteHtml(id, rec, plain){
  const n=ftNorm(rec, plain);
  if(!(n.text_en||n.text_es)){
    const s=plain||"";
    if(!s) return "";
    if(I18N.es[s]) return escH(s);
    return `<span class="ft"><span class="ft-badge">${n.lang==="es"?"ES":"EN"}</span><span class="raw ft-text">${escH(s)}</span></span>`;
  }
  const v=ftView(rec, plain, id);
  const tog=v.canToggle?`<button type="button" class="ft-tog" onclick="ftToggle('${id}')">${v.showingOrig?t("Translation"):t("Original")}</button>`:"";
  return `<span class="ft"><span class="ft-badge">${v.shown}</span><span class="raw ft-text">${escH(v.text)}</span>${tog}</span>`;

function roomFlow(r){

  if(r.s==="RFI") return "cleaned";
  if(r.s==="VC"||r.s==="OC") return "ready";
  if(r.t0&&!r.t1) return "progress";

}
function legacyFromFlow(r){

function agoLabel(ts){

  const min=Math.max(0,Math.round((Date.now()-ts)/60000));
  if(min<1) return t("Just now");
  if(min<60) return t("{n} min ago",{n:min});
  const h=Math.floor(min/60),m=min%60;
  return t("{h} h {m} min ago",{h,m});
}
function flowToast(status,r){

function setRoomFlow(n,status,extra){

  if(r.occ==null) r.occ=r.s==="OC"||r.s==="OD";
  r.flow=status;
  if(status==="progress"){r.t0=now();r.ts=Date.now();r.t1="";r.mins=0;r.cleanedAt=0;r.x=""}

}

// Plan hours and actual punches will later come from Hotel Effectiveness.
// laborPlan.hours[hotel|SHUTTLE][position] = Mon..Sun plan hours.
// laborPlan.associate[hotel|SHUTTLE][name] = Mon..Sun plan hours.
// laborPlan.rooms[hotel] = Mon..Sun room count used for housekeeping MPR.
// timePunches[hotel|SHUTTLE][name] = Mon..Sun [in,out] or null.
// Example data is below. If data/labor.json is present, it replaces laborPlan and timePunches.
// Win/loss reads this same shape for the open week. Older weeks stay on the demo generator
// until labor_plans, time_punches, and schedule_shifts cover those dates.
// labor_plans: hotel_id, plan_date, position, plan_hours, optional employee (associate share).
// time_punches: hotel_id, work_date, employee, punch_in, punch_out (blank punch_out = missed out).
// schedule_shifts: hotel_id or shuttle, position, employee, shift_date, start_time, end_time.
// Occupied rooms for housekeeping MPR: laborPlan.rooms, later forecasts.occupied_rooms.
const HE_ROOMS={MSPWE:[32,32,28,32,34,30,0],MSPAM:[30,30,26,32,34,28,0],MSPMS:[28,30,26,30,32,26,0]};
const HE_PAT={
"Front Desk":{days:[0,1,2,3,4,5],a:"07:00",b:"15:00",over:{2:["06:00","16:00"]}},
"Housekeeping":{days:[0,1,2,3,4],a:"07:00",b:"15:00"},
"Housekeeper":{days:[0,1,2,3,4,5],a:"08:00",b:"16:00",over:{2:["07:00","17:30"]}},
"Maintenance":{days:[0,1,2,3,4],a:"08:00",b:"16:00"},
"House Person":{days:[0,1,2,3,4,5],a:"08:00",b:"16:00"},
"Laundry Attendant":{days:[0,1,2,3,4,5],a:"07:00",b:"15:00"},
"Breakfast Attendant":{days:[0,1,2,3,4,5],a:"05:30",b:"13:30",over:{4:["05:00","14:00"]}},
"Shuttle Driver":{days:[0,1,2,3,4,5],a:"07:00",b:"15:00",over:{2:["06:00","15:00"]},late:["15:00","23:00"]}
};
function expandHE(users){
  const hours={SHUTTLE:{"Shuttle Driver":[0,0,0,0,0,0,0]}},associate={SHUTTLE:{}},punches={SHUTTLE:{}};
  Object.keys(HE_ROOMS).forEach(h=>{hours[h]={};associate[h]={};punches[h]={}});
  const drivers=users.filter(u=>u.role==="Shuttle Driver").slice().sort((a,b)=>a.hotel.localeCompare(b.hotel));
  users.forEach(u=>{
    if(!u.hotel||!HE_PAT[u.role])return;
    const pos=u.role==="Housekeeping"?"HK Lead":u.role, pat=HE_PAT[u.role], bucket=u.role==="Shuttle Driver"?"SHUTTLE":u.hotel;
    const late=u.role==="Shuttle Driver"&&drivers[1]&&drivers[1].id===u.id;
    const plan=[0,0,0,0,0,0,0]; pat.days.forEach(i=>plan[i]=8);
    associate[bucket][u.name]=plan;
    punches[bucket][u.name]=[0,1,2,3,4,5,6].map(i=>{
      if(!pat.days.includes(i))return null;
      if(late)return pat.late.slice();
      if(pat.over&&pat.over[i])return pat.over[i].slice();
      return [pat.a,pat.b];
    });
    if(!hours[bucket][pos])hours[bucket][pos]=[0,0,0,0,0,0,0];
    plan.forEach((n,i)=>hours[bucket][pos][i]+=n);
  });
  return {laborPlan:{hours:hours,associate:associate,rooms:HE_ROOMS},timePunches:punches};
}

function heFlags(people){
  const clopen=new Set(), double=new Set();
  const otNames=[], clopenNames=[], doubleNames=[];
  const days=weekDates(S.wk||0).map(ymd);
  const daySet=new Set(days);
  const prevD=new Date(days[0]+"T12:00:00"); prevD.setDate(prevD.getDate()-1);
  const nextD=new Date(days[6]+"T12:00:00"); nextD.setDate(nextD.getDate()+1);
  const prev=ymd(prevD), next=ymd(nextD);
  const windowSet=new Set([prev].concat(days,[next]));
  people.forEach(p=>{
    const all=(S.shifts||[]).filter(s=>s.who===p.name&&windowSet.has(s.date)&&(s.scope===S.hotel||s.scope==="SHUTTLE"));
    const spans=all.map(s=>{
      const a0=clockMin(s.start), b0=clockMin(s.end);
      if(a0==null||b0==null) return null;
      let b=b0; if(b<=a0) b+=1440;
      let base=days.indexOf(s.date)*1440;
      if(s.date===prev) base=-1440;
      if(s.date===next) base=7*1440;
      return {s:s,a:base+a0,b:base+b};
    }).filter(Boolean).sort((x,y)=>x.a-y.a||x.b-y.b);
    let hitD=false, hitC=false;
    for(let i=0;i<spans.length;i++){
      for(let j=i+1;j<spans.length;j++){
        if(spans[j].a>=spans[i].b) break;
        if(daySet.has(spans[i].s.date)||daySet.has(spans[j].s.date)){
          double.add(spans[i].s.id); double.add(spans[j].s.id); hitD=true;
        }
      }
    }
    for(let i=0;i<spans.length-1;i++){
      const gap=spans[i+1].a-spans[i].b;
      if(gap>0&&gap<480&&(daySet.has(spans[i].s.date)||daySet.has(spans[i+1].s.date))){
        clopen.add(spans[i].s.id); clopen.add(spans[i+1].s.id); hitC=true;
      }
    }
    const weekShifts=all.filter(s=>daySet.has(s.date));
    if(sumHrs(weekShifts)>40.05) otNames.push(p.name);
    if(hitC) clopenNames.push(p.name);
    if(hitD) doubleNames.push(p.name);
  });
  return {clopen:clopen,double:double,otNames:otNames,clopenNames:clopenNames,doubleNames:doubleNames};
}

function heMove(e){

    let a=clockMin(heDrag.start), b=clockMin(heDrag.end);
    if(heDrag.edge==="l") a=snap15(a+steps*15); else b=snap15(b+steps*15);
    if(b-a<30){if(heDrag.edge==="l") a=b-30; else b=a+30}

      const spans=chip.querySelectorAll(".raw");

  }

async function syncEquip(hotel,before,after){

  let failed=false;

    const live=(S.h[hotel].equip||[]).find(e=>String(e.id)===item.key); if(!live) continue;

    else {const res=await dbInsert("equipment",body);if(res.source==="supabase"&&res.data&&res.data.id)live.sb_id=res.data.id;else failed=true}
  }
  for(const item of (after&&after.equipLog)||[]){
    const was=prevL.get(item.key);
    if(was&&was.sig===item.sig) continue;
    const live=(S.h[hotel].equipLog||[]).find(g=>String(g.id)===item.key); if(!live||live.sb_id) continue;
    const body=eqLogBody(hotel,live);
    const res=await dbInsert("equipment_service_log",body);

  }
  return failed;
}

async function syncPmSched(hotel,before,after){
  const prevS=new Map(((before&&before.pmSched)||[]).map(x=>[x.key,x]));
  const prevJ=new Map(((before&&before.pmJobs)||[]).map(x=>[x.key,x]));
  let failed=false;
  for(const item of (after&&after.pmSched)||[]){
    const was=prevS.get(item.key);
    if(was&&was.sig===item.sig) continue;
    const live=(S.h[hotel].pmSched||[]).find(s=>String(s.id)===item.key); if(!live) continue;
    const body=pmSchedBody(hotel,live);
    if(!body){failed=true;continue}
    if(live.sb_id){const res=await dbUpdate("pm_schedules",live.sb_id,body);if(res.source!=="supabase") failed=true}
    else {const res=await dbInsert("pm_schedules",body);if(res.source==="supabase"&&res.data&&res.data.id) live.sb_id=res.data.id;else failed=true}
  }
  for(const item of (after&&after.pmJobs)||[]){
    const was=prevJ.get(item.key);
    if(was&&was.sig===item.sig) continue;
    const live=(S.h[hotel].pmJobs||[]).find(j=>String(j.id)===item.key); if(!live) continue;
    const body=pmJobBody(hotel,live);
    if(!body){failed=true;continue}
    if(live.sb_id){const res=await dbUpdate("pm_tasks",live.sb_id,body);if(res.source!=="supabase") failed=true}
    else {const res=await dbInsert("pm_tasks",body);if(res.source==="supabase"&&res.data&&res.data.id) live.sb_id=res.data.id;else failed=true}
  }
  return failed;
}

function roomBias(n){const hot={305:92,108:78,208:70,107:62,206:54,308:46,301:40};return hot[n]!=null?hot[n]:((n*13)%28)}
function deriveHealth(turns,reviews){
  const out=[];
  const hotels=[...new Set(turns.map(t=>t.hotel).concat(reviews.map(r=>r.hotel)).filter(Boolean))];
  [30,90,365].forEach(days=>{
    hotels.forEach(hotel=>{
      const rooms=[...new Set(turns.filter(t=>t.hotel===hotel).map(t=>t.room).concat(reviews.filter(r=>r.hotel===hotel).map(r=>r.room)))];
      rooms.forEach(room=>{
        const ts=turns.filter(t=>t.hotel===hotel&&t.room===room&&t.age<=days&&t.age>=0);
        const rs=reviews.filter(r=>r.hotel===hotel&&r.room===room&&r.age<=days&&r.age>=0);
        if(!ts.length&&!rs.length)return;
        const scores=ts.map(t=>t.clean).filter(x=>x!=null);
        const clean=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
        const row={hotel,room,days,tickets:ts.filter(t=>t.ticket).length,repeat:ts.filter(t=>t.repeat&&t.ticket).length,open:ts.filter(t=>t.open&&t.ticket).length,fails:ts.filter(t=>t.passed===false).length,reviews:rs.length,clean};
        row.problem=problemOf(row);
        out.push(row);
      });
    });
  });
  return out;
}
function buildDemoReports(){

  ["MSPWE","MSPAM","MSPMS"].forEach((hotel,hi)=>{
    const staff=reportStaff(hotel);
    for(let f=1;f<=3;f++)for(let r=1;r<=8;r++){
      const n=f*100+r,bias=roomBias(n);
      const offsets=[];
      const count=2+Math.round(bias/18);
      for(let i=0;i<count;i++)offsets.push(Math.min(360,Math.max(1,Math.round((i+1)*18-bias/10+(n%5)))));
      if(bias>=54)[2,9,16,24].forEach(x=>offsets.push(x));
      offsets.sort((a,b)=>a-b);
      offsets.forEach((off,i)=>{
        const clean=Math.max(42,Math.min(97,Math.round(96-bias*0.48+(i%3)*2-hi)));
        const failed=clean<78;
        const tag=tags[(n+i+hi)%tags.length];
        const slots=bias>=85?4:bias>=70?3:bias>=55?2:bias>=36?1:0;
        const hasTicket=i<slots||(off>30&&bias>=55&&i%4===0);

        if(i%3===0)reviews.push({hotel,room:String(n),at:isoDaysAgo(Math.max(1,off-1)),age:Math.max(1,off-1),score:Math.max(40,clean-4),tags:[tag],cleaner:staff.hk});
      });
    }
  });
  // Yesterday's cleans are room turns, not labor hours. MSPAM has them. The other hotels do not, so the 9 AM card shows there.
  const yday=isoDaysAgo(1);
  for(let i=turns.length-1;i>=0;i--){if(turns[i].at===yday&&turns[i].hotel!=="MSPAM")turns.splice(i,1)}

  }
  return {source:"example",health:deriveHealth(turns,reviews),turns,reviews};
}
