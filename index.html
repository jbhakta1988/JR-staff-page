// HOTEL EFFECTIVENESS DATA LAYER
// Plan hours and actual punches will later come from Hotel Effectiveness.
// laborPlan.hours[hotel|SHUTTLE][position] = Mon..Sun plan hours.
// laborPlan.associate[hotel|SHUTTLE][name] = Mon..Sun plan hours.
// laborPlan.rooms[hotel] = Mon..Sun room count used for housekeeping MPR.
// timePunches[hotel|SHUTTLE][name] = Mon..Sun [in,out] or null.
// Example data is below. If data/labor.json is present, it replaces laborPlan and timePunches.
const HE_ROOMS={MSPWE:[32,32,28,32,34,30,0],MSPAM:[30,30,26,32,34,28,0],MSPMS:[28,30,26,30,32,26,0]};
const HE_PAT={
"Front Desk":{days:[0,1,2,3,4,5],a:"07:00",b:"15:00",over:{2:["06:00","16:00"]}},
"Housekeeping":{days:[0,1,2,3,4],a:"07:00",b:"15:00"},
"Housekeeper":{days:[0,1,2,3,4,5],a:"08:00",b:"16:00",over:{2:["07:00","17:30"]}},
"Maintenance":{days:[0,1,2,3,4],a:"08:00",b:"16:00"},
"House Person":{days:[0,1,2,3,4,5],a:"08:00",b:"16:00"},
"Laundry Attendant":{days:[0,1,2,3,4,5],a:"07:00",b:"15:00"},
"Breakfast Attendant":{days:[0,1,2,3,4,5],a:"05:30",b:"13:30",over:{4:["05:00","14:00"]}},
"Shuttle Driver":{days:[0,1,2,3,4,5],a:"07:00",b:"15:00",over:{2:["06:00","15:00"]},late:["15:00","23:00"]}
};
function expandHE(users){
  const hours={SHUTTLE:{"Shuttle Driver":[0,0,0,0,0,0,0]}},associate={SHUTTLE:{}},punches={SHUTTLE:{}};
  Object.keys(HE_ROOMS).forEach(h=>{hours[h]={};associate[h]={};punches[h]={}});
  const drivers=users.filter(u=>u.role==="Shuttle Driver").slice().sort((a,b)=>a.hotel.localeCompare(b.hotel));
  users.forEach(u=>{
    if(!u.hotel||!HE_PAT[u.role])return;
    const pos=u.role==="Housekeeping"?"HK Lead":u.role, pat=HE_PAT[u.role], bucket=u.role==="Shuttle Driver"?"SHUTTLE":u.hotel;
    const late=u.role==="Shuttle Driver"&&drivers[1]&&drivers[1].id===u.id;
    const plan=[0,0,0,0,0,0,0]; pat.days.forEach(i=>plan[i]=8);
    associate[bucket][u.name]=plan;
    punches[bucket][u.name]=[0,1,2,3,4,5,6].map(i=>{
      if(!pat.days.includes(i))return null;
      if(late)return pat.late.slice();
      if(pat.over&&pat.over[i])return pat.over[i].slice();
      return [pat.a,pat.b];
    });
    if(!hours[bucket][pos])hours[bucket][pos]=[0,0,0,0,0,0,0];
    plan.forEach((n,i)=>hours[bucket][pos][i]+=n);
  });
  return {laborPlan:{hours:hours,associate:associate,rooms:HE_ROOMS},timePunches:punches};
}

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mondayOf(off){const n=new Date();n.setHours(12,0,0,0);n.setDate(n.getDate()-((n.getDay()+6)%7)+7*(off||0));return n}
function weekDates(off){const s=mondayOf(off);return [0,1,2,3,4,5,6].map(i=>{const d=new Date(s);d.setDate(s.getDate()+i);return d})}

function ensureSched(){
  if(!S.shifts)S.shifts=[];
  if(!S.pub)S.pub={};
  if(S.schedSeed)return;
  const drivers=USERS.filter(u=>u.role==="Shuttle Driver").slice().sort((a,b)=>a.hotel.localeCompare(b.hotel));
  [0,-1].forEach(off=>{
    const days=weekDates(off);
    USERS.forEach(u=>{
      const pat=HE_PAT[u.role]; if(!pat||!u.hotel)return;
      const pos=u.role==="Housekeeping"?"HK Lead":u.role, scope=u.role==="Shuttle Driver"?"SHUTTLE":u.hotel;
      const late=u.role==="Shuttle Driver"&&drivers[1]&&drivers[1].id===u.id;
      days.forEach((d,i)=>{
        if(!pat.days.includes(i))return;
        let a=pat.a,b=pat.b;
        if(late){a=pat.late[0];b=pat.late[1]}
        else if(pat.over&&pat.over[i]){a=pat.over[i][0];b=pat.over[i][1]}
        S.shifts.push({id:sid(),scope:scope,pos:pos,who:u.name,date:ymd(d),start:a,end:b});

    });
  });

}

  const cur=weekDates(S.wk||0),prev=weekDates((S.wk||0)-1),map={};

    const date=ymd(d),list=shiftTimes(pos,date);
    if(!list.length)return "";
    return `<h3>${DOWLAB[(d.getDay()+6)%7]} ${d.getMonth()+1}/${d.getDate()}</h3><table class="fit"><tr><th class="nm">Name</th><th>In</th><th>Out</th></tr>${list.map(s=>`<tr><td class="nm">${escH(s.who)}</td><td>${escH(s.start)}</td><td>${escH(s.end)}</td></tr><tr><td colspan="3"><div class="row"><button type="button" class="btn2" onclick="edShift('${s.id}')">Edit</button><button type="button" class="btn2" onclick="cpShift('${s.id}')">Copy</button><button type="button" class="btn2" onclick="delShift('${s.id}')">Delete</button></div></td></tr>`).join("")}</table>`;
  }).join("");
  const where=pos==="Shuttle Driver"?"Shared shuttle · MSPAM + MSPMS":escH(S.hotel+" · "+pos);
  return `<div id="schedRoot"><h2>Schedule</h2><p style="font-size:13px;margin:0">${where} · ${pub?"Published":"Draft"}</p>${pager}${mode}${tabs}<div class="card"><div class="row"><button type="button" class="btn2" onclick="copyLast()">Copy last week</button>${canPublish()&&!pub?`<button type="button" class="btn" onclick="publishWeek()">Publish week</button>`:""}</div>${SCHED_NOTE?`<p>${escH(SCHED_NOTE)}</p>`:""}<small>Plan hours are example data from Hotel Effectiveness. Var = scheduled − plan. Over plan is highlighted.${hk?" MPR = housekeeping minutes per room (target 30).":""}</small>${sumTable}</div><div class="card">${form}</div><div class="card">${byDay||"No shifts this position."}</div></div>`;
}
V.sched=schedPage;
try{render()}catch(e){document.getElementById("app").innerHTML="<div class=card>Error: "+e.message+"</div>";throw e}
fetch("data/labor.json").then(r=>r.ok?r.json():null).then(j=>{if(!j||!j.laborPlan||!j.timePunches)return;laborPlan=j.laborPlan;timePunches=j.timePunches;try{render()}catch(e){}}).catch(()=>{});
</script></body></html>
