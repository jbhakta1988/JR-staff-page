}

function parseRoomSig(sig){
  const parts=String(sig||"").split("|");
  let flow="";
  if(parts.length&&FLOW_OK[parts[parts.length-1]]) flow=parts.pop();
  let pri="normal";
  if(parts.length&&HK_PRI.includes(parts[parts.length-1])) pri=parts.pop();
  const s=parts.shift()||"";
  return {s,hk:parts.join("|"),pri,flow};
}
function roomFlow(r){
  if(r&&FLOW_OK[r.flow]) return r.flow;
  if(!r) return "dirty";
  if(r.s==="OOO") return "ooo";
  if(r.s==="RFI") return "cleaned";
  if(r.s==="VC"||r.s==="OC") return "ready";
  if(r.t0&&!r.t1) return "progress";
  return "dirty";
}
function legacyFromFlow(r){
  const f=roomFlow(r);
  if(f==="ooo"){r.s="OOO";return}
  const occ=!!r.occ;
  if(f==="cleaned") r.s="RFI";
  else if(f==="ready") r.s=occ?"OC":"VC";
  else r.s=occ?"OD":"VD";
}
function flowLabel(f){
  return {dirty:"Dirty",progress:"In progress",cleaned:"Cleaned",ready:"Guest Ready",reclean:"Reclean",ooo:"Out of order"}[f]||"Dirty";
}
function agoLabel(ts){
  if(!ts) return "";
  const min=Math.max(0,Math.round((Date.now()-ts)/60000));
  if(min<1) return t("Just now");
  if(min<60) return t("{n} min ago",{n:min});
  const h=Math.floor(min/60),m=min%60;
  return t("{h} h {m} min ago",{h,m});
}
function flowToast(status,r){
  const n=r.n,who=r.hk||"";
  if(status==="progress") return t("Room {n} started. In progress.",{n});
  if(status==="cleaned") return t("Room {n} is cleaned and ready to inspect.",{n});
  if(status==="ready") return t("Room {n} passed inspection. Guest ready.",{n});
  if(status==="reclean") return t("Room {n} failed. Sent back to {who} as Reclean.",{n,who});
  if(status==="ooo") return t("Room {n} is out of order.",{n});
  return t("Room {n} is dirty.",{n});
}

function persistRoomStatus(hotel,row,prev,note,actor){

  const roomRow={id:row.sb_id||("local-room-"+hotel+"-"+row.n),hotel_id:hotel,department:"housekeeping",room_number:String(row.n),floor:Math.floor(Number(row.n)/100)||null,hk_status:row.s||null,fo_status:row.s||null,status};
  const logRow={hotel_id:hotel,room_number:String(row.n),status,previous_status:prev||null,note:note||"",actor:actor||""};
  if(!useRemote()){dbCachePut("rooms",roomRow);dbCachePut("room_status_log",Object.assign({id:"local-rlog-"+hotel+"-"+row.n+"-"+Date.now()},logRow));return}
  const write=row.sb_id?dbUpdate("rooms",row.sb_id,{hk_status:roomRow.hk_status,fo_status:roomRow.fo_status,status}):dbInsert("rooms",roomRow).then(res=>{if(res&&res.data&&res.data.id)row.sb_id=res.data.id;return res});
  Promise.resolve(write).then(()=>dbInsert("room_status_log",logRow));
}
function setRoomFlow(n,status,extra){
  const d=D(),r=d.rooms.find(x=>x.n==n);
  if(!r||!FLOW_OK[status]) return;
  extra=extra||{};
  const prev=roomFlow(r);
  if(r.occ==null) r.occ=r.s==="OC"||r.s==="OD";
  r.flow=status;
  if(status==="progress"){r.t0=now();r.ts=Date.now();r.t1="";r.mins=0;r.cleanedAt=0;r.x=""}
  else if(status==="cleaned"){r.t1=now();r.mins=Math.max(1,Math.round((Date.now()-(r.ts||Date.now()))/60000));r.cleanedAt=Date.now();r.x="";if(prev!=="cleaned")d.roomsCleaned=(d.roomsCleaned||0)+1}
  else if(status==="ready"){r.x=""}
  else if(status==="reclean"){r.t0=r.t1="";r.ts=0;r.mins=0;r.cleanedAt=0;r.x="";r.failNote=extra.note||"";r.failPhoto=extra.photo||""}
  else if(status==="dirty"||status==="ooo"){r.t0=r.t1="";r.ts=0;r.mins=0;r.cleanedAt=0}
  legacyFromFlow(r);
  d.statusLog=d.statusLog||[];
  const entry={room:String(r.n),status,previous_status:prev,note:extra.note||"",actor:cw(),at:new Date().toISOString(),photo:extra.photo||"",synced:true};
  d.statusLog.unshift(entry);
  persistRoomStatus(S.hotel,r,prev,entry.note,entry.actor);
  if(!useRemote()) showToast(flowToast(status,r));
  save();render();
}

// laborPlan.associate[hotel|SHUTTLE][name] = Mon..Sun plan hours.
// laborPlan.rooms[hotel] = Mon..Sun room count used for housekeeping MPR.

// Example data is below. If data/labor.json is present, it replaces laborPlan and timePunches.
// Win/loss reads this same shape for the open week. Older weeks stay on the demo generator
// until labor_plans, time_punches, and schedule_shifts cover those dates.
// labor_plans: hotel_id, plan_date, position, plan_hours, optional employee (associate share).
// time_punches: hotel_id, work_date, employee, punch_in, punch_out (blank punch_out = missed out).

function wlChart(rows){
  const w=320,h=150,padL=28,padB=22,padT=8,padR=6,iw=w-padL-padR,ih=h-padT-padB;
  const max=Math.max(1,...rows.map(r=>Math.max(r.actual||0,r.plan||0)));
  let bars="";
  rows.forEach((r,i)=>{
    const gw=iw/rows.length, x=padL+i*gw, bw=Math.max(4,gw*0.28), y0=padT+ih;
    const ph=ih*((r.plan||0)/max), ah=ih*((r.actual||0)/max);
    const fill=(r.actual==null)?"#c5cbd6":(wlWin((r.actual||0)-(r.plan||0))?"#1a7f37":"#c0262d");
    bars+=`<rect x="${(x+gw*0.16).toFixed(1)}" y="${(y0-ph).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,ph).toFixed(1)}" fill="#9eb6d6"></rect>`;
    bars+=`<rect x="${(x+gw*0.52).toFixed(1)}" y="${(y0-ah).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,ah).toFixed(1)}" fill="${fill}"></rect>`;
    bars+=`<text x="${(x+gw/2).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="8" fill="#445">${escH(r.label)}</text>`;
  });
  return `<svg class="wlchart" viewBox="0 0 ${w} ${h}" role="img" aria-label="8-week trend"><line x1="${padL}" y1="${padT+ih}" x2="${w-padR}" y2="${padT+ih}" stroke="#ddd"></line>${bars}</svg>`;
}

function heFlags(people){
  const clopen=new Set(), double=new Set();
  const otNames=[], clopenNames=[], doubleNames=[];
  const days=weekDates(S.wk||0).map(ymd);
  const daySet=new Set(days);
  const prevD=new Date(days[0]+"T12:00:00"); prevD.setDate(prevD.getDate()-1);
  const nextD=new Date(days[6]+"T12:00:00"); nextD.setDate(nextD.getDate()+1);
  const prev=ymd(prevD), next=ymd(nextD);
  const windowSet=new Set([prev].concat(days,[next]));
  people.forEach(p=>{
    const all=(S.shifts||[]).filter(s=>s.who===p.name&&windowSet.has(s.date)&&(s.scope===S.hotel||s.scope==="SHUTTLE"));
    const spans=all.map(s=>{
      const a0=clockMin(s.start), b0=clockMin(s.end);
      if(a0==null||b0==null) return null;
      let b=b0; if(b<=a0) b+=1440;
      let base=days.indexOf(s.date)*1440;
      if(s.date===prev) base=-1440;
      if(s.date===next) base=7*1440;
      return {s:s,a:base+a0,b:base+b};
    }).filter(Boolean).sort((x,y)=>x.a-y.a||x.b-y.b);
    let hitD=false, hitC=false;
    for(let i=0;i<spans.length;i++){
      for(let j=i+1;j<spans.length;j++){
        if(spans[j].a>=spans[i].b) break;
        if(daySet.has(spans[i].s.date)||daySet.has(spans[j].s.date)){
          double.add(spans[i].s.id); double.add(spans[j].s.id); hitD=true;
        }
      }
    }
    for(let i=0;i<spans.length-1;i++){
      const gap=spans[i+1].a-spans[i].b;
      if(gap>0&&gap<480&&(daySet.has(spans[i].s.date)||daySet.has(spans[i+1].s.date))){
        clopen.add(spans[i].s.id); clopen.add(spans[i+1].s.id); hitC=true;
      }
    }
    const weekShifts=all.filter(s=>daySet.has(s.date));
    if(sumHrs(weekShifts)>40.05) otNames.push(p.name);
    if(hitC) clopenNames.push(p.name);
    if(hitD) doubleNames.push(p.name);
  });
  return {clopen:clopen,double:double,otNames:otNames,clopenNames:clopenNames,doubleNames:doubleNames};
}
function heWarnHtml(flags, overDays){
  const bits=[];
  if(flags.otNames.length) bits.push(`<span class="heflag"><b class="raw">${flags.otNames.length}</b> Overtime</span>`);
  if(flags.clopenNames.length) bits.push(`<span class="heflag"><b class="raw">${flags.clopenNames.length}</b> Clopen</span>`);
  if(flags.doubleNames.length) bits.push(`<span class="heflag"><b class="raw">${flags.doubleNames.length}</b> Double booked</span>`);
  if(overDays.length) bits.push(`<span class="heflag"><b class="raw">${overDays.length}</b> Over plan</span>`);
  const who=[...new Set(flags.clopenNames.concat(flags.doubleNames))].slice(0,4).map(n=>`<span class="raw">${escH(n)}</span>`).join(" ");
  const bar=bits.length?`<div class="heflags" id="heWarn">${bits.join("")}</div>`:`<div class="heflags" id="heWarn"><span class="heflag">No warnings.</span></div>`;
  return bar+(who?`<p class="wlnote" id="heWarnWho">${who}</p>`:"");
}
function heChip(s, flags){

  const fromEl=$("heFrom"), toEl=$("heTo");

  if(!(from>=0&&from<=6&&to>=0&&to<=6)||from===to){SCHED_NOTE=t("Pick two different days.");save();render();return}

function heWrite(start,end){
  const p=S.hePick; if(!p||!canEditSched()||!schedPos().includes(p.pos))return;
  if(shHrs(start,end)<=0){const msg=$("heMsg"); if(msg) msg.textContent=t("Choose a name, a day this week, and an end time after the start."); return}

}

function heRow(uid, label, pos, open, flags){
  const dates=weekDates(S.wk||0).map(ymd);
  const cols=heCols();
  const who=open?"":label;
  let hrs=0;
  for(let i=0;i<7;i++) hrs+=sumHrs(heCellShifts(pos, dates[i], who));
  const cells=cols.map(i=>{
    const list=heCellShifts(pos, dates[i], who);
    return `<div class="hecell" data-uid="${escH(uid)}" data-date="${dates[i]}" data-pos="${escH(pos)}">${list.map(s=>heChip(s,flags)).join("")}</div>`;
  }).join("");
  const ot=!open&&hrs>40.05;
  const name=open?"Open shifts":`<span class="raw">${escH(label)}</span>`;
  return `<div class="hename${open?" open":""}">${name}<small>${escH(shortRole(pos))}</small>${ot?`<small class="bad raw">OT</small>`:""}</div>${cells}<div class="hetot${ot?" bad":""}"><span class="raw">${escH(fmtH(hrs))}</span></div>`;
}
function heDrop(id, uid, date, pos, copy){
  const s=(S.shifts||[]).find(x=>x.id===id);
  if(!s||s.pos!==pos||!schedPos().includes(pos)||!date)return;
  const person=uid?USERS.find(u=>u.id===uid):null;
  if(uid&&(!person||wlPosOf(person)!==pos))return;
  const who=person?person.name:"";
  if(copy){
    S.shifts.push({id:sid(),scope:schedScope(pos),pos:pos,who:who,date:date,start:s.start,end:s.end});
    SCHED_NOTE=t("Shift copied");
  }else{
    if(s.who===who&&s.date===date) return;
    s.who=who; s.date=date; s.scope=schedScope(pos);
    SCHED_NOTE=t("Shift moved");
  }
  S.hePick=null;save();render();
}
function heCellAt(x,y){
  const hide=[...document.querySelectorAll("header,.heday,.hename,.hetot.head,#heghost")];
  hide.forEach(el=>{el.style.pointerEvents="none"});
  let list=[];
  try{list=document.elementsFromPoint?document.elementsFromPoint(x,y):[document.elementFromPoint(x,y)]}
  finally{hide.forEach(el=>{el.style.pointerEvents=""})}
  for(const el of list){
    if(!el||!el.closest) continue;
    const cell=el.closest(".hecell");
    if(cell) return cell;
  }
  return null;
}
function heGhost(text,x,y,copy){
  let g=document.getElementById("heghost");
  if(!g){g=document.createElement("div");g.id="heghost";g.className="hechip";g.style.cssText="position:fixed;z-index:90;width:92px;opacity:.92;pointer-events:none";document.body.appendChild(g)}
  g.textContent=(copy?"+ ":"")+text;
  g.style.left=(x-36)+"px"; g.style.top=(y-16)+"px";
}
function heDown(e){
  if(!canEditSched()||(e.button!=null&&e.button!==0))return;
  if(e.target.closest&&e.target.closest("#heSheet"))return;
  const chip=e.target.closest&&e.target.closest(".hechip");
  const cell=e.target.closest&&e.target.closest(".hecell");
  if(chip){
    const s=(S.shifts||[]).find(x=>x.id===chip.dataset.id);
    if(!s)return;
    if(e.cancelable) e.preventDefault();
    try{chip.setPointerCapture(e.pointerId)}catch(err){}
    const edge=e.target.closest(".heedge");
    heDrag={kind:edge?"edge":"move",id:s.id,pointerId:e.pointerId,edge:edge?edge.dataset.edge:"",x0:e.clientX,y0:e.clientY,moved:false,copy:!!(e.altKey||e.ctrlKey||e.metaKey||S.heCopy),start:s.start,end:s.end,pos:s.pos};
    return;
  }
  if(cell) heDrag={kind:"cell",pointerId:e.pointerId,x0:e.clientX,y0:e.clientY,moved:false,cell:cell};
}
function heMove(e){
  if(!heDrag||e.pointerId!==heDrag.pointerId)return;
  const dx=e.clientX-heDrag.x0, dy=e.clientY-heDrag.y0;
  if(heDrag.kind==="cell"){if(dx*dx+dy*dy>64) heDrag.moved=true;return}
  if(!heDrag.moved&&dx*dx+dy*dy<64) return;
  heDrag.moved=true;
  if(e.cancelable) e.preventDefault();
  if(heDrag.kind==="edge"){
    const steps=Math.round(dy/18);
    let a=clockMin(heDrag.start), b=clockMin(heDrag.end);
    if(heDrag.edge==="l") a=snap15(a+steps*15); else b=snap15(b+steps*15);
    if(b-a<30){if(heDrag.edge==="l") a=b-30; else b=a+30}
    a=Math.max(0,Math.min(23*60,a));
    b=Math.max(a+30,Math.min(23*60+45,b));
    heDrag.nextA=minToHH(a); heDrag.nextB=minToHH(b);
    const chip=document.querySelector('.hechip[data-id="'+heDrag.id+'"]');
    if(chip){
      const spans=chip.querySelectorAll(".raw");
      if(spans[0]) spans[0].textContent=shortClock(heDrag.nextA)+"–"+shortClock(heDrag.nextB);
      if(spans[1]) spans[1].textContent=fmtH(shHrs(heDrag.nextA,heDrag.nextB))+"h";
    }
    return;
  }
  heDrag.copy=!!(e.altKey||e.ctrlKey||e.metaKey||S.heCopy);
  const s=(S.shifts||[]).find(x=>x.id===heDrag.id);
  heGhost(s?shortClock(s.start)+"–"+shortClock(s.end):"", e.clientX, e.clientY, heDrag.copy);
  document.querySelectorAll(".hecell.drop").forEach(el=>el.classList.remove("drop"));
  const cell=heCellAt(e.clientX,e.clientY);
  heDrag.cell=cell&&cell.dataset.pos===heDrag.pos?cell:null;
  if(heDrag.cell) heDrag.cell.classList.add("drop");
}
function heUp(e){
  if(!heDrag||(e&&e.pointerId!=null&&e.pointerId!==heDrag.pointerId))return;
  const d=heDrag; heDrag=null;
  const g=document.getElementById("heghost"); if(g) g.remove();
  document.querySelectorAll(".hecell.drop").forEach(el=>el.classList.remove("drop"));
  if(d.kind==="cell"){
    if(!d.moved&&d.cell) heAdd(d.cell.dataset.uid||"", d.cell.dataset.date, d.cell.dataset.pos);
    return;
  }
  if(d.kind==="edge"){
    if(d.moved&&d.nextA){
      const s=(S.shifts||[]).find(x=>x.id===d.id);
      if(s&&shHrs(d.nextA,d.nextB)>0){s.start=d.nextA;s.end=d.nextB;SCHED_NOTE=t("Shift saved");save();render()}
    }
    return;
  }
  if(!d.moved){heOpenEdit(d.id);return}
  const cell=d.cell;
  if(!cell) return;
  heDrop(d.id, cell.dataset.uid||"", cell.dataset.date, cell.dataset.pos, !!(d.copy||(e&&(e.altKey||e.ctrlKey||e.metaKey))));
}
function bootHe(){
  if(bootHe.done) return;
  bootHe.done=true;
  document.addEventListener("pointerdown", heDown, {passive:false});
  document.addEventListener("pointermove", heMove, {passive:false});
  document.addEventListener("pointerup", heUp);
  document.addEventListener("pointercancel", heUp);
}
bootHe();

function heBuilder(pager, days, wk){
  const positions=heDeptPositions();

    const plan=positions.reduce((a,p)=>a+hePlan(p,i),0);

    if(over) overDays.push(i);
    return `<div class="heday"><span class="raw">${escH(dowShort(i)+" "+days[i].getDate())}</span><span class="pv ${over?"loss":"win"}"><span class="raw">${escH(fmtH(sched)+"/"+fmtH(plan))}</span></span></div>`;

function schedPage(){

        const punch=((timePunches[bucket]||{})[person.name]||[])[di];

        return `<tr><td class="nm">${escH(person.name)}</td><td>${fmtH(plan)}</td><td>${fmtH(sched)}</td><td>${actual==null?"—":fmtH(actual)}</td><td class="${v>0.05?"over":""}">${fmtVar(v)}</td></tr>`;

  }

    const was=prevL.get(item.key);
    if(was&&was.sig===item.sig) continue;
    const live=(S.h[hotel].equipLog||[]).find(g=>String(g.id)===item.key); if(!live||live.sb_id) continue;

function addFreq(iso,s){
  const d=new Date(String(iso||"").slice(0,10)+"T12:00:00");
  if(isNaN(+d)) return "";
  const f=s&&s.frequency;
  if(f==="monthly") d.setMonth(d.getMonth()+1);
  else if(f==="quarterly") d.setMonth(d.getMonth()+3);
  else if(f==="semiannual") d.setMonth(d.getMonth()+6);
  else if(f==="annual") d.setFullYear(d.getFullYear()+1);
  else if(f==="weekly") d.setDate(d.getDate()+7);
  else if(f==="daily") d.setDate(d.getDate()+1);
  else d.setDate(d.getDate()+(Number(s.intervalDays)||1));
  return ymd(d);
}

async function syncPmSched(hotel,before,after){
  const prevS=new Map(((before&&before.pmSched)||[]).map(x=>[x.key,x]));
  const prevJ=new Map(((before&&before.pmJobs)||[]).map(x=>[x.key,x]));
  let failed=false;
  for(const item of (after&&after.pmSched)||[]){
    const was=prevS.get(item.key);
    if(was&&was.sig===item.sig) continue;
    const live=(S.h[hotel].pmSched||[]).find(s=>String(s.id)===item.key); if(!live) continue;
    const body=pmSchedBody(hotel,live);
    if(!body){failed=true;continue}
    if(live.sb_id){const res=await dbUpdate("pm_schedules",live.sb_id,body);if(res.source!=="supabase") failed=true}
    else {const res=await dbInsert("pm_schedules",body);if(res.source==="supabase"&&res.data&&res.data.id) live.sb_id=res.data.id;else failed=true}
  }
  for(const item of (after&&after.pmJobs)||[]){
    const was=prevJ.get(item.key);
    if(was&&was.sig===item.sig) continue;
    const live=(S.h[hotel].pmJobs||[]).find(j=>String(j.id)===item.key); if(!live) continue;
    const body=pmJobBody(hotel,live);
    if(!body){failed=true;continue}
    if(live.sb_id){const res=await dbUpdate("pm_tasks",live.sb_id,body);if(res.source!=="supabase") failed=true}
    else {const res=await dbInsert("pm_tasks",body);if(res.source==="supabase"&&res.data&&res.data.id) live.sb_id=res.data.id;else failed=true}
  }
  return failed;
}

function isoDaysAgo(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysSince(iso){const day=String(iso||"").slice(0,10);if(!day)return 9999;const a=new Date(day+"T12:00:00"),b=new Date();b.setHours(12,0,0,0);return Math.round((b-a)/86400000)}
function problemOf(h){const raw=reportNum(h.tickets)*4+reportNum(h.repeat)*3+reportNum(h.open)*4+reportNum(h.fails)*3+Math.max(0,100-reportNum(h.clean_score!=null?h.clean_score:h.clean))*0.25+reportNum(h.reviews);return Math.max(0,Math.min(99,Math.round(raw)))}
function normHealth(r){

  const row={hotel:r.hotel_id||r.hotel||"",room:String(r.room_number!=null?r.room_number:r.room),days:Number(r.window_days!=null?r.window_days:(r.days!=null?r.days:30))||30,tickets:reportNum(r.tickets),repeat:reportNum(r.repeat!=null?r.repeat:r.repeat_tickets),open:reportNum(r.open!=null?r.open:r.open_tickets),fails:reportNum(r.fails!=null?r.fails:r.fail_count),reviews:reportNum(r.reviews!=null?r.reviews:r.review_count),clean};
  row.problem=r.problem_score!=null||r.problem!=null?reportNum(r.problem_score!=null?r.problem_score:r.problem):problemOf(row);

  return {hk:{MSPWE:"Maria Alvarez",MSPAM:"Rosa Vega",MSPMS:"Ana Lopez"}[hotel]||"Housekeeper",lead:{MSPWE:"Grace Patel",MSPAM:"Nina Shah",MSPMS:"Grace Kim"}[hotel]||"Inspector"};
}
function roomBias(n){const hot={305:92,108:78,208:70,107:62,206:54,308:46,301:40};return hot[n]!=null?hot[n]:((n*13)%28)}
function deriveHealth(turns,reviews){
  const out=[];
  const hotels=[...new Set(turns.map(t=>t.hotel).concat(reviews.map(r=>r.hotel)).filter(Boolean))];
  [30,90,365].forEach(days=>{
    hotels.forEach(hotel=>{
      const rooms=[...new Set(turns.filter(t=>t.hotel===hotel).map(t=>t.room).concat(reviews.filter(r=>r.hotel===hotel).map(r=>r.room)))];
      rooms.forEach(room=>{
        const ts=turns.filter(t=>t.hotel===hotel&&t.room===room&&t.age<=days&&t.age>=0);
        const rs=reviews.filter(r=>r.hotel===hotel&&r.room===room&&r.age<=days&&r.age>=0);
        if(!ts.length&&!rs.length)return;
        const scores=ts.map(t=>t.clean).filter(x=>x!=null);
        const clean=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
        const row={hotel,room,days,tickets:ts.filter(t=>t.ticket).length,repeat:ts.filter(t=>t.repeat&&t.ticket).length,open:ts.filter(t=>t.open&&t.ticket).length,fails:ts.filter(t=>t.passed===false).length,reviews:rs.length,clean};
        row.problem=problemOf(row);
        out.push(row);
      });
    });
  });
  return out;
}
function buildDemoReports(){
  const turns=[],reviews=[];
  const tags=["Bath","Dust","Linen","HVAC","Odor","Carpet"];
  const tickets=["PTAC","Leak","TV","Door","Smell","Drain"];
  ["MSPWE","MSPAM","MSPMS"].forEach((hotel,hi)=>{
    const staff=reportStaff(hotel);
    for(let f=1;f<=3;f++)for(let r=1;r<=8;r++){
      const n=f*100+r,bias=roomBias(n);
      const offsets=[];
      const count=2+Math.round(bias/18);
      for(let i=0;i<count;i++)offsets.push(Math.min(360,Math.max(1,Math.round((i+1)*18-bias/10+(n%5)))));
      if(bias>=54)[2,9,16,24].forEach(x=>offsets.push(x));
      offsets.sort((a,b)=>a-b);
      offsets.forEach((off,i)=>{
        const clean=Math.max(42,Math.min(97,Math.round(96-bias*0.48+(i%3)*2-hi)));
        const failed=clean<78;
        const tag=tags[(n+i+hi)%tags.length];
        const slots=bias>=85?4:bias>=70?3:bias>=55?2:bias>=36?1:0;
        const hasTicket=i<slots||(off>30&&bias>=55&&i%4===0);
        turns.push({hotel,room:String(n),at:isoDaysAgo(off),age:off,cleaner:staff.hk,inspector:i%4===3?"":staff.lead,passed:!failed,clean,issues:failed?[tag,tags[(n+i+2)%tags.length]]:[tag],ticket:hasTicket?tickets[(n+i)%tickets.length]:"",open:hasTicket&&off<=30&&i<2,repeat:hasTicket&&bias>=70&&i%2===0});
        if(i%3===0)reviews.push({hotel,room:String(n),at:isoDaysAgo(Math.max(1,off-1)),age:Math.max(1,off-1),score:Math.max(40,clean-4),tags:[tag],cleaner:staff.hk});
      });
    }
  });
  // Yesterday's cleans are room turns, not labor hours. MSPAM has them. The other hotels do not, so the 9 AM card shows there.
  const yday=isoDaysAgo(1);
  for(let i=turns.length-1;i>=0;i--){if(turns[i].at===yday&&turns[i].hotel!=="MSPAM")turns.splice(i,1)}
  if(!turns.some(t=>t.hotel==="MSPAM"&&t.at===yday&&t.cleaner)){
    const staff=reportStaff("MSPAM");
    [101,102,105,201,305].forEach((n,i)=>turns.push({hotel:"MSPAM",room:String(n),at:yday,age:1,cleaner:staff.hk,inspector:i%2?staff.lead:"",passed:i!==4,clean:i===4?70:90,issues:["Linen"],ticket:"",open:false,repeat:false}));
  }
  return {source:"example",health:deriveHealth(turns,reviews),turns,reviews};
}

function healthList(hotel,days,mode){

  return rows;
}
function scoreRows(hotel,days){
  const b=reportBundle();
  const turns=b.turns.filter(t=>t.hotel===hotel&&t.age<=days&&t.age>=0);
  const reviews=b.reviews.filter(r=>r.hotel===hotel&&r.age<=days&&r.age>=0);
  const map={};
  function slot(name,role){const k=role+"|"+name;if(!map[k])map[k]={name,role,cleaned:0,inspected:0,fails:0,scores:[],tags:{},reviews:0};return map[k]}
  turns.forEach(t=>{
    if(t.cleaner){const s=slot(t.cleaner,"Housekeeper");s.cleaned++;if(t.passed===false)s.fails++;if(t.clean!=null)s.scores.push(t.clean);t.issues.forEach(tag=>{s.tags[tag]=(s.tags[tag]||0)+1})}
    if(t.inspector){const s=slot(t.inspector,"Inspector");s.inspected++;if(t.passed===false)s.fails++;if(t.clean!=null)s.scores.push(t.clean);t.issues.forEach(tag=>{s.tags[tag]=(s.tags[tag]||0)+1})}
  });
  reviews.forEach(r=>{
    if(r.cleaner)slot(r.cleaner,"Housekeeper").reviews++;
    const turn=turns.filter(t=>t.room===r.room&&t.inspector&&t.at<=r.at).sort((a,b)=>b.at.localeCompare(a.at))[0];
    if(turn)slot(turn.inspector,"Inspector").reviews++;
  });
  return Object.values(map).map(s=>{
    const base=s.role==="Inspector"?s.inspected:s.cleaned;
    const top=Object.entries(s.tags).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0];
    return {name:s.name,role:s.role,cleaned:s.cleaned,inspected:s.inspected,reviews:s.reviews,rate:base?Math.round(100*s.fails/base):0,avg:s.scores.length?Math.round(s.scores.reduce((a,c)=>a+c,0)/s.scores.length):0,tag:top?top[0]:""};
  }).filter(s=>s.cleaned||s.inspected).sort((a,b)=>b.rate-a.rate||a.avg-b.avg||a.name.localeCompare(b.name));
}

const GI_CATS=[["room","Room","Habitación","Housekeeping"],["clean","Cleanliness","Limpieza","Housekeeping"],["noise","Noise","Ruido","Front Desk"],["maint","Maintenance","Mantenimiento","Maintenance"],["bfast","Breakfast","Desayuno","Breakfast"],["staff","Staff","Personal","GM"],["bill","Billing","Facturación","GM"],["other","Other","Otro","Front Desk"]];

const GI_ST=[["open","Open","Abierta"],["prog","In progress","En proceso"],["done","Resolved","Resuelta"]];
const GI_REC=[["none","None yet","Ninguna aún"],["apology","Apology","Disculpa"],["amenity","Amenity / snack","Cortesía / bocadillo"],["points","Points / loyalty","Puntos / lealtad"],["discount","Discount","Descuento"],["comp","Room comped","Habitación de cortesía"],["other","Other","Otro"]];
const GI_DEPT={"Housekeeping":["Housekeeping","Ama de llaves"],"Maintenance":["Maintenance","Mantenimiento"],"Breakfast":["Breakfast","Desayuno"],"Front Desk":["Front Desk","Recepción"],"GM":["Management","Gerencia"]};
const GI_ROLEOF={Housekeeping:"Housekeeping",Maintenance:"Maintenance",Breakfast:"Breakfast Attendant",GM:"GM","Front Desk":"Front Desk"};
function giFind(a,k){return a.find(x=>x[0]===k)||a[0]}
function giCatName(k){const x=giFind(GI_CATS,k);return bx(x[1],x[2])}
function giSevName(k){const x=giFind(GI_SEV,k);return bx(x[1],x[2])}
function giStName(k){const x=giFind(GI_ST,k);return bx(x[1],x[2])}
function giRecName(k){const x=giFind(GI_REC,k);return bx(x[1],x[2])}
function giDeptName(k){const x=GI_DEPT[k]||GI_DEPT["Front Desk"];return bx(x[0],x[1])}
function giYmd(n){const d=new Date(Date.now()+(n||0)*864e5),p=x=>String(x).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function giMyDept(){const r=S.role;return r==="Housekeeping"||r==="Housekeeper"?"Housekeeping":r==="Maintenance"?"Maintenance":r==="Breakfast Attendant"?"Breakfast":r==="Front Desk"?"Front Desk":""}
function giCanLog(){const r=authRole();return r==="GM"||r==="AGM"||r==="Front Desk"}
function giCanWork(){return authRole()!=="Above Property"}
function giList(){const d=D();if(!d.gi){d.gi=[];
  const wid=careNextId(d.wo||[]);d.wo=d.wo||[];d.wo.push({id:wid,room:"108",t:"Guest issue: AC is loud and not cooling (guest reported at desk)",p:"Med",s:"In Progress",photo:"",comments:[],gi:2});
  d.gi=[{id:1,room:"214",cat:"noise",sev:"high",note:"Loud party next door after 11 PM, guest could not sleep.",st:"open",rec:"none",dep:giYmd(1),dept:"Front Desk",at:careAgo(0.2),by:"",ex:1},
  {id:2,room:"108",cat:"maint",sev:"med",note:"AC is loud and not cooling.",st:"prog",rec:"amenity",dep:giYmd(0),dept:"Maintenance",at:careAgo(0.4),by:"",wo:wid,ex:1},
  {id:3,room:"305",cat:"bfast",sev:"low",note:"Waffle station was out of batter at 8:30.",st:"done",rec:"apology",dep:giYmd(-1),dept:"Breakfast",at:careAgo(1.5),by:"",ex:1}]}return d.gi}
function giForm(){S.gif=S.gif||{room:"",cat:"room",sev:"med",note:"",dep:"",rec:"none"};return S.gif}
function giSet(k,v){giForm()[k]=v;render()}
function giSync(){const f=giForm();["gRoom","gNote","gDep"].forEach(id=>{const e=$(id);if(e)f[id==="gRoom"?"room":id==="gNote"?"note":"dep"]=e.value})}
function giPick(k,v){giSync();giForm()[k]=v;render()}
function giPost(){giSync();const f=giForm();
  if(!f.room.trim()||!f.note.trim()){const e=$("gErr");if(e)e.textContent=bx("Add the room and a short note.","Agrega la habitación y una nota corta.");return}
  const d=D(),list=giList(),cat=giFind(GI_CATS,f.cat),id=careNextId(list),row={id,room:f.room.trim(),cat:f.cat,sev:f.sev,note:f.note.trim(),st:"open",rec:f.rec,dep:f.dep||"",dept:cat[3],at:new Date().toISOString(),by:cw(),photo:ph||""};
  if(f.cat==="maint"){const wid=careNextId(d.wo);d.wo.unshift({id:wid,room:row.room,t:"Guest issue: "+row.note+" (logged by "+cw()+")",p:f.sev==="high"?"High":f.sev==="low"?"Low":"Med",s:"Open",photo:ph||"",comments:[],gi:id});row.wo=wid}
  list.unshift(row);
  const to=GI_ROLEOF[row.dept];if(to&&to!==authRole())careAlert(bx("🛎️ New guest issue · Rm "+row.room,"🛎️ Nueva queja de huésped · Hab. "+row.room),giCatName(row.cat)+" · "+giSevName(row.sev)+": "+row.note,{role:to});
  S.gif={room:"",cat:"room",sev:"med",note:"",dep:"",rec:"none"};ph="";phFile=null;save();showToast(bx("Issue logged and sent to "+giDeptName(row.dept),"Queja registrada y enviada a "+giDeptName(row.dept)));render()}
function giStatus(id,st){const g=giList().find(x=>x.id===id);if(!g)return;g.st=st;if(st==="done")g.doneAt=new Date().toISOString();save();render()}
function giRecSet(id,v){const g=giList().find(x=>x.id===id);if(!g)return;g.rec=v;save();render()}
function giDepDay(g){if(!g.dep)return 99;const a=new Date(g.dep+"T00:00:00"),b=new Date(giYmd(0)+"T00:00:00");return Math.round((a-b)/864e5)}
function giOpen(){return giList().filter(g=>g.st!=="done")}
function giDue(){return giOpen().filter(g=>giDepDay(g)<=1&&giDepDay(g)>=0).sort((a,b)=>giDepDay(a)-giDepDay(b))}
function giDepLabel(g){const n=giDepDay(g);return n===99?"":n===0?bx("departs today","sale hoy"):n===1?bx("departs tomorrow","sale mañana"):n<0?bx("departed","ya salió"):bx("departs "+g.dep.slice(5),"sale "+g.dep.slice(5))}
const GI_SEVC={low:"VC",med:"OD",high:"VD"};
function giCard(g){const rem=g.st!=="done"&&giDepDay(g)<=1&&giDepDay(g)>=0,wo=g.wo&&(D().wo||[]).find(w=>w.id===g.wo),can=giCanWork();
  return `<div class="card ${rem?"miss-red":""}" style="${rem?"":"border-left:4px solid #c0262d"}"><div class="row" style="margin:0"><b style="flex:0 0 auto">🛏️ ${bx("Rm","Hab.")} ${escH(g.room)}</b><span class="pill ${GI_SEVC[g.sev]}" style="flex:0 0 auto">${giSevName(g.sev)}</span><span class="pill ${g.st==="done"?"VC":g.st==="prog"?"OC":"VD"}" style="flex:0 0 auto">${giStName(g.st)}</span>${g.ex?`<span class="pill OD" style="flex:0 0 auto">${bx("EXAMPLE","EJEMPLO")}</span>`:""}</div>
  <div style="margin:6px 0"><span class="pill RFI">${giCatName(g.cat)}</span> <small>→ ${giDeptName(g.dept)}</small></div><div class="raw">${escH(g.note)}</div>${g.photo?`<img class="prev" alt="" src="${g.photo}">`:""}
  <small>${escH(careDate(g.at))}${g.by?" · "+escH(String(g.by).split(" ")[0]):""}${g.dep?" · 🧳 "+escH(giDepLabel(g)):""}</small>
  ${rem?`<div class="bad" style="margin-top:4px">⏰ ${bx("Follow up with this guest before they check out.","Da seguimiento a este huésped antes de que salga.")}</div>`:""}
  ${wo?`<div style="margin-top:6px"><button class="btn2" onclick="go('wo')">🔧 ${bx("Work order","Orden de trabajo")} #${wo.id} · ${escH(wo.s)} ›</button></div>`:""}
  <div class="row" style="margin-top:6px"><label style="flex:0 0 auto"><small>${bx("Recovery offered","Compensación ofrecida")}</small></label><select ${can?"":"disabled"} aria-label="${escH(bx("Recovery offered","Compensación ofrecida"))}" onchange="giRecSet(${g.id},this.value)">${GI_REC.map(r=>`<option value="${r[0]}" ${g.rec===r[0]?"selected":""}>${bx(r[1],r[2])}</option>`).join("")}</select></div>
  ${can?`<div class="chips">${GI_ST.map(s=>`<button class="chip ${g.st===s[0]?"on":""}" aria-pressed="${g.st===s[0]}" onclick="giStatus(${g.id},'${s[0]}')">${bx(s[1],s[2])}</button>`).join("")}</div>`:""}</div>`}
M.gi=["🛎️","Guest Issues"];
V.gi=function(){const f=giForm(),all=giList(),mine=giMyDept(),lead=careLead(),sel=S.giv||(lead?"all":"mine");
  const form=giCanLog()?`<div class="card"><h3>${bx("Log a guest issue","Registrar queja de huésped")}</h3><div class="row"><input id="gRoom" inputmode="numeric" placeholder="${escH(bx("Room #","Hab. #"))}" value="${escH(f.room)}" aria-label="${escH(bx("Room number","Número de habitación"))}"><input id="gDep" type="date" value="${escH(f.dep)}" aria-label="${escH(bx("Guest departure date (optional)","Fecha de salida (opcional)"))}"></div><small>${bx("Departure date is optional; it powers the follow-up reminder.","La fecha de salida es opcional; activa el recordatorio de seguimiento.")}</small>
  <div class="chips" role="group">${GI_CATS.map(c=>`<button type="button" class="chip ${f.cat===c[0]?"on":""}" aria-pressed="${f.cat===c[0]}" onclick="giPick('cat','${c[0]}')">${bx(c[1],c[2])}</button>`).join("")}</div>
  <div class="chips" role="group">${GI_SEV.map(c=>`<button type="button" class="chip ${f.sev===c[0]?"on":""}" aria-pressed="${f.sev===c[0]}" onclick="giPick('sev','${c[0]}')">${bx(c[1],c[2])}</button>`).join("")}</div>
  <textarea id="gNote" style="width:100%;min-height:64px" placeholder="${escH(bx("Short note","Nota corta"))}">${escH(f.note)}</textarea>
  <div class="row"><select id="gRec" onchange="giPick('rec',this.value)" aria-label="${escH(bx("Recovery offered","Compensación ofrecida"))}">${GI_REC.map(r=>`<option value="${r[0]}" ${f.rec===r[0]?"selected":""}>${bx("Recovery: ","Compensación: ")}${bx(r[1],r[2])}</option>`).join("")}</select></div>
  <div class="row">${photoField()}</div>${photoPrev()}<small>${bx("Goes to","Va a")}: <b>${giDeptName(giFind(GI_CATS,f.cat)[3])}</b>${f.cat==="maint"?" + "+bx("work order","orden de trabajo"):""}</small>
  <div class="bad" id="gErr" role="alert"></div><button class="btn" style="width:100%" onclick="giPost()">${bx("Log issue","Registrar queja")}</button></div>`:"";
  const rows=sel==="mine"&&mine?all.filter(g=>g.dept===mine):sel!=="all"&&sel!=="mine"?all.filter(g=>g.dept===sel):all,open=rows.filter(g=>g.st!=="done"),done=rows.filter(g=>g.st==="done");
  const tabs=`<div class="chips">${mine&&!lead?`<button class="chip ${sel==="mine"?"on":""}" onclick="S.giv='mine';render()">${bx("My queue","Mi cola")} (${all.filter(g=>g.dept===mine&&g.st!=="done").length})</button>`:""}<button class="chip ${sel==="all"?"on":""}" onclick="S.giv='all';render()">${bx("All","Todas")} (${giOpen().length})</button>${Object.keys(GI_DEPT).map(k=>`<button class="chip ${sel===k?"on":""}" onclick="S.giv='${k}';render()">${giDeptName(k)} (${all.filter(g=>g.dept===k&&g.st!=="done").length})</button>`).join("")}</div>`;
  const due=giDue();
  return `<h2>🛎️ ${bx("Guest Issues","Quejas de Huéspedes")}</h2>${due.length&&giCanWork()?`<div class="miss-banner">⏰ ${due.length} ${bx("guest(s) with open issues leave today/tomorrow — follow up","huésped(es) con quejas abiertas salen hoy/mañana — dar seguimiento")}</div>`:""}${form}<div class="card"><h3>${bx("Department queues","Colas por departamento")}</h3>${tabs}</div>${open.map(giCard).join("")||`<div class="card"><small>${bx("No open issues here. 🎉","Sin quejas abiertas aquí. 🎉")}</small></div>`}${done.length?`<div class="card"><h3>${bx("Resolved","Resueltas")} (${done.length})</h3></div>${done.map(giCard).join("")}`:""}`};
function giHomeCard(){const r=S.role,due=giDue(),mine=giMyDept(),n=mine?giList().filter(g=>g.dept===mine&&g.st!=="done").length:0;
  if(!(giCanWork()&&(authRole()==="GM"||authRole()==="AGM"||authRole()==="Front Desk"||n)))return "";
  const lines=[];if(due.length)lines.push(`<div class="miss-banner" style="margin:6px 0 0">⏰ ${due.length} ${bx("guest(s) with open issues depart soon — follow up","huésped(es) con quejas abiertas salen pronto — dar seguimiento")}</div>`);
  if(authRole()==="Front Desk"||authRole()==="GM"||authRole()==="AGM"){}else if(n)lines.push(`<div style="margin-top:6px">${n} ${bx("open in your queue","abiertas en tu cola")}</div>`);
  if(!lines.length&&!(authRole()==="Front Desk"))return "";
  return `<div class="card" onclick="go('gi')" style="cursor:pointer"><b>🛎️ ${bx("Guest issues","Quejas de huéspedes")}</b> <span class="badge ${giOpen().length?"":"zero"}">${giOpen().length}</span>${lines.join("")}<br><small>${giCanLog()?bx("Log or review ›","Registrar o revisar ›"):bx("Open my queue ›","Abrir mi cola ›")}</small></div>`}
ROLES.forEach(r=>{TILES[r]=TILES[r]||[];if(!TILES[r].includes("gi")&&!["Shuttle Driver","House Person","Laundry Attendant"].includes(r))TILES[r].push("gi")});
const _homeGi=V.home;V.home=function(){return giHomeCard()+_homeGi()};

// Lost & found v2: photo, where/room/found by/date, guest contact log, status (stored/claimed/shipped/disposed),
// release-to + signature checkbox, 90-day disposal reminder, search. Replaces the old simple list (old rows are migrated once).
const LF_ST=[["stored","Stored","Guardado"],["claimed","Claimed","Reclamado"],["shipped","Shipped","Enviado"],["disposed","Disposed","Desechado"]];
const LF_DAYS=90,LF_SOON=75;
function lfStName(k){const x=LF_ST.find(y=>y[0]===k)||LF_ST[0];return bx(x[1],x[2])}
function lfList(){const d=D();if(!d.lfx){const old=Array.isArray(d.lf)?d.lf:[],map={Holding:"stored",Claimed:"claimed",Shipped:"shipped",Disposed:"disposed"};
  d.lfx=old.map((x,i)=>({id:i+1,photo:"",desc:x.it||"-",where:"",room:String(x.room||""),by:x.by||"",at:careAgo(2+i),st:map[x.st]||"stored",contacts:[],rel:null,ex:1}));
  const n=()=>careNextId(d.lfx);
  d.lfx.push({id:n(),photo:"",desc:"Gold ring (small), found by the sink",where:"Bathroom, checked-out room",room:"108",by:"Rosa (EX)",at:careAgo(95),st:"stored",contacts:[{at:careAgo(92),who:"Front desk",how:"call",note:"Left voicemail for the guest"},{at:careAgo(85),who:"Front desk",how:"email",note:"Emailed claim instructions, no reply"}],rel:null,ex:1});
  d.lfx.push({id:n(),photo:"",desc:"Navy hoodie",where:"Pool deck",room:"",by:"Maria (EX)",at:careAgo(20),st:"claimed",contacts:[{at:careAgo(18),who:"Front desk",how:"call",note:"Guest will pick up"}],rel:{to:"Guest (EXAMPLE)",sig:true,at:careAgo(15)},ex:1});
  d.lf=d.lf||[]}
  return d.lfx}
function lfCanManage(){const r=authRole();return r==="GM"||r==="AGM"||r==="Front Desk"||r==="Housekeeping"}
function lfCanLog(){return authRole()!=="Above Property"}
function lfAge(x){return Math.floor((Date.now()-new Date(x.at).getTime())/864e5)}
function lfDueDays(x){return LF_DAYS-lfAge(x)}
function lfDue(){return lfList().filter(x=>x.st==="stored"&&lfDueDays(x)<=0)}
function lfSoon(){return lfList().filter(x=>x.st==="stored"&&lfDueDays(x)>0&&lfDueDays(x)<=LF_DAYS-LF_SOON)}
function lfF(){S.lff=S.lff||{room:"",desc:"",where:"",by:"",date:""};return S.lff}
function lfSync(){const f=lfF();[["lfDesc","desc"],["lfWhere","where"],["lfRoom","room"],["lfBy","by"],["lfDate","date"]].forEach(([i,k])=>{const e=$(i);if(e)f[k]=e.value})}
function lfAdd(){lfSync();const f=lfF();if(!f.desc.trim()){const e=$("lfErr");if(e)e.textContent=bx("Add a short description.","Agrega una descripción corta.");return}
  const list=lfList();list.unshift({id:careNextId(list),photo:ph||"",desc:f.desc.trim(),where:f.where.trim(),room:f.room.trim(),by:f.by.trim()||cw(),at:f.date?new Date(f.date+"T12:00:00").toISOString():new Date().toISOString(),st:"stored",contacts:[],rel:null});
  S.lff={room:"",desc:"",where:"",by:"",date:""};ph="";phFile=null;save();showToast(bx("Item logged","Artículo registrado"));render()}
function lfQ(v){S.lfq=v;const e=$("lfList");if(e)e.innerHTML=lfRows()}
function lfFilt(k){S.lfs=k;render()}
function lfOpen(id){S.lfo=S.lfo===id?0:id;S.lfrel=0;render()}
function lfContact(id){const x=lfList().find(y=>y.id===id);if(!x)return;const how=$("lcHow"+id).value,note=$("lcNote"+id).value.trim();x.contacts.push({at:new Date().toISOString(),who:cw(),how,note});save();render()}
function lfRelForm(id){S.lfrel=S.lfrel===id?0:id;render()}
function lfRelease(id,kind){const x=lfList().find(y=>y.id===id);if(!x)return;const to=($("lrTo"+id).value||"").trim(),sig=$("lrSig"+id).checked,e=$("lrErr"+id);
  if(!to){e.textContent=bx("Enter who it is released to.","Escribe a quién se entrega.");return}
  if(!sig){e.textContent=bx("Check the signature box once the guest has signed.","Marca la casilla cuando el huésped haya firmado.");return}
  x.st=kind;x.rel={to,sig:true,at:new Date().toISOString(),by:cw(),track:($("lrTrk"+id)&&$("lrTrk"+id).value||"").trim()};S.lfrel=0;save();render()}
function lfDispose(id){const x=lfList().find(y=>y.id===id);if(!x)return;x.st="disposed";x.rel={to:bx("Disposed per policy","Desechado según política"),sig:false,at:new Date().toISOString(),by:cw()};save();render()}
function lfHit(x,q){return !q||[x.desc,x.where,x.room,x.by,x.rel&&x.rel.to,x.st,lfStName(x.st)].join(" ").toLowerCase().includes(q.toLowerCase())}
const LF_HOW={call:["Call","Llamada"],email:["Email","Correo"],text:["Text","Texto"],person:["In person","En persona"]};
function lfCard(x){const open=S.lfo===x.id,mg=lfCanManage(),due=x.st==="stored"&&lfDueDays(x)<=0,soon=x.st==="stored"&&!due&&lfDueDays(x)<=LF_DAYS-LF_SOON;

  let det="";
  if(open){det=`<div style="margin-top:8px"><small><b>${bx("Guest contact log","Registro de contacto")}</b></small>${x.contacts.map(c=>`<div class="wlpos"><small>${escH(careDate(c.at))} · ${bx(LF_HOW[c.how][0],LF_HOW[c.how][1])} · ${escH(String(c.who).split(" ")[0])}</small><br>${escH(c.note||"")}</div>`).join("")||`<div><small>${bx("No contact attempts yet.","Aún sin intentos de contacto.")}</small></div>`}
    ${lfCanLog()&&x.st==="stored"?`<div class="row"><select id="lcHow${x.id}" style="flex:0 0 110px" aria-label="${escH(bx("Contact method","Medio de contacto"))}">${Object.keys(LF_HOW).map(k=>`<option value="${k}">${bx(LF_HOW[k][0],LF_HOW[k][1])}</option>`).join("")}</select><input id="lcNote${x.id}" placeholder="${escH(bx("What happened?","¿Qué pasó?"))}"><button class="btn2" style="flex:0 0 64px" onclick="lfContact(${x.id})">+</button></div>`:""}
    ${x.rel?`<div class="wlpos">${x.st==="disposed"?"🗑️":"✍️"} ${escH(x.rel.to)} · ${escH(careDate(x.rel.at))}${x.rel.sig?" · "+bx("signed","firmado"):""}${x.rel.track?" · "+escH(x.rel.track):""}</div>`:""}
    ${mg&&x.st==="stored"?`<div class="chips"><button class="chip" onclick="lfRelForm(${x.id})">${bx("Release / ship","Entregar / enviar")}</button>${lfDueDays(x)<=0?`<button class="chip" onclick="lfDispose(${x.id})">${bx("Mark disposed","Marcar desechado")}</button>`:""}</div>`:""}
    ${S.lfrel===x.id?`<div class="card" style="background:#f4f7fb"><input id="lrTo${x.id}" style="width:100%" placeholder="${escH(bx("Released to (name)","Entregado a (nombre)"))}" aria-label="${escH(bx("Released to","Entregado a"))}"><input id="lrTrk${x.id}" style="width:100%;margin-top:6px" placeholder="${escH(bx("Tracking # if shipped (optional)","# de rastreo si se envía (opcional)"))}"><label class="li"><input type="checkbox" id="lrSig${x.id}"><span>${bx("Recipient signed for the item","El destinatario firmó de recibido")}</span></label><div class="bad" id="lrErr${x.id}" role="alert"></div><div class="row"><button class="btn" onclick="lfRelease(${x.id},'claimed')">${bx("Claimed","Reclamado")}</button><button class="btn" onclick="lfRelease(${x.id},'shipped')">${bx("Shipped","Enviado")}</button></div></div>`:""}</div>`}
  return `<div class="card" style="padding:10px"><div style="display:flex;gap:10px;align-items:flex-start" onclick="lfOpen(${x.id})">${x.photo?`<img alt="" src="${x.photo}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none">`:`<span style="width:64px;height:64px;border-radius:8px;background:#eef3fa;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none">🧳</span>`}<div style="flex:1;min-width:0"><b class="raw">${escH(x.desc)}</b>${x.ex?` <span class="pill OD">${bx("EXAMPLE","EJEMPLO")}</span>`:""}<br><small>${x.room?bx("Rm ","Hab. ")+escH(x.room)+" · ":""}${escH(x.where||"")}</small><br><small>${bx("Found","Encontrado")} ${escH(careDate(x.at))} · ${escH(String(x.by).split(" ")[0])} · ${lfAge(x)}${bx("d ago","d")}</small><div style="margin-top:4px"><span class="pill ${x.st==="stored"?"OC":x.st==="disposed"?"OOO":"VC"}">${lfStName(x.st)}</span> ${flag} ${x.contacts.length?`<small>📞 ${x.contacts.length}</small>`:""}</div></div></div>${det}</div>`}
